<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><rect width="1100" height="520" fill="#101923"/><g font-family="sans-serif" fill="#e6edf3"><text x="40" y="42" font-size="25">Session layer aliases: Top / Bottom on a top / bottom board</text><text x="40" y="98" font-size="21">Before: 0 of 4 wires imported</text><text x="40" y="145" font-size="19">Layer: top</text><rect x="40" y="160" width="470" height="105" rx="8" fill="#1d2b38"/><path d="M 125 188 H 410" stroke="#ef8c7e" stroke-width="8" opacity="0.18" stroke-dasharray="12"/><path d="M 125 233 H 410" stroke="#ef8c7e" stroke-width="8" opacity="0.18" stroke-dasharray="12"/><text x="40" y="300" font-size="19">Layer: bottom</text><rect x="40" y="315" width="470" height="105" rx="8" fill="#1d2b38"/><path d="M 125 343 H 410" stroke="#75baff" stroke-width="8" opacity="0.18" stroke-dasharray="12"/><path d="M 125 388 H 410" stroke="#75baff" stroke-width="8" opacity="0.18" stroke-dasharray="12"/><text x="40" y="490" font-size="17">Case-insensitive existence check suppresses aliases</text><text x="570" y="98" font-size="21">After: 4 of 4 wires imported</text><text x="570" y="145" font-size="19">Layer: top</text><rect x="570" y="160" width="470" height="105" rx="8" fill="#1d2b38"/><path d="M 655 188 H 940" stroke="#ef8c7e" stroke-width="8" opacity="1" stroke-dasharray="0"/><path d="M 655 233 H 940" stroke="#ef8c7e" stroke-width="8" opacity="1" stroke-dasharray="0"/><text x="570" y="300" font-size="19">Layer: bottom</text><rect x="570" y="315" width="470" height="105" rx="8" fill="#1d2b38"/><path d="M 655 343 H 940" stroke="#75baff" stroke-width="8" opacity="1" stroke-dasharray="0"/><path d="M 655 388 H 940" stroke="#75baff" stroke-width="8" opacity="1" stroke-dasharray="0"/><text x="570" y="490" font-size="17">Aliases resolve to the first and last layer</text></g></svg>