<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450"><rect width="1200" height="450" fill="#f4f7fb"/><g font-family="sans-serif" fill="#142538"><text x="50" y="65" font-size="30">Fractional coordinates alias integer grid cells</text><text x="50" y="120" font-size="23">Three-column grid: cell = gy × 3 + gx</text><rect x="50" y="155" width="520" height="230" rx="16" fill="#ffe1dc"/><rect x="620" y="155" width="530" height="230" rx="16" fill="#d9f2e5"/><g font-size="23"><text x="75" y="200">Before: bounds check accepts (0, 1/3)</text><text x="75" y="250">cell = (1/3) × 3 + 0 = 1</text><text x="75" y="300">Decoded start becomes (1, 0)</text><text x="75" y="350">Search reports success from wrong start</text><text x="645" y="200">After: require integer gx and gy</text><text x="645" y="250">Reject (0, 1/3) before packing</text><text x="645" y="300">Empty path, zero node pops</text><text x="645" y="350">Valid integer endpoints keep their behavior</text></g><text x="50" y="425" font-size="18">Synthetic regression reproduced in single-sheet and layered A*; no native completion gain claimed.</text></g></svg>