<text x="1040" y="305" fill="#152033" font-family="sans-serif" font-size="23">0</text>
<text x="30" y="375" fill="#152033" font-family="sans-serif" font-size="19">Finite samples are diagnostic evidence only; arbitrary shapes and full bridge connectivity remain unverified.</text>
