if">reject</text><text x="30" y="329" fill="#152033" style="font: 22px sans-serif">missing-project</text><text x="390" y="329" fill="#152033" style="font: 22px sans-serif">0</text><text x="650" y="329" fill="#152033" style="font: 22px sans-serif">True</text><text x="970" y="329" fill="#152033" style="font: 22px sans-serif">False</text><text x="1250" y="329" fill="#152033" style="font: 22px sans-serif">reject</text><text x="30" y="385" fill="#152033" style="font: 21px sans-serif">Original source files unchanged in all 12 checks. Candidate boards still have one native open.</text><text x="30" y="422" fill="#152033" style="font: 20px sans-serif">Fixture diagnostic: no live ownership, atomic publication, general rule validation or production safety proof.</text></svg>
