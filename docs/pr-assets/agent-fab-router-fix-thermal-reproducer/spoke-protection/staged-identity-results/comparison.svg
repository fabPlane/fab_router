29" fill="#152033" style="font: 22px sans-serif">reject</text><text x="30" y="385" fill="#152033" style="font: 21px sans-serif">All probes observed the sentinel. All original files unchanged. No routing rerun or candidate publication.</text><text x="30" y="422" fill="#152033" style="font: 21px sans-serif">Persistent-change detection only: no locking, transient-change detection or atomic publication.</text></svg>
