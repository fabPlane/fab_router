<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="540"><rect width="1160" height="540" fill="white"/>
<text x="30" y="48" font-family="sans-serif" font-size="29">Two-axis shared-junction proposals at U1.53</text>
<text x="30" y="90" font-family="sans-serif" font-size="21">Same composed board and host; native refill and DRC; three repeats</text>
<text x="30" y="150" font-family="sans-serif" font-size="21">Repeat 1: 24 proposals; 12 remove target; accepted: False</text>
<text x="50" y="184" font-family="sans-serif" font-size="19">Candidate errors: 4–8; selected errors/opens: 4/15 (unchanged)</text>
<text x="30" y="238" font-family="sans-serif" font-size="21">Repeat 2: 24 proposals; 12 remove target; accepted: False</text>
<text x="50" y="272" font-family="sans-serif" font-size="19">Candidate errors: 4–8; selected errors/opens: 4/15 (unchanged)</text>
<text x="30" y="326" font-family="sans-serif" font-size="21">Repeat 3: 24 proposals; 12 remove target; accepted: False</text>
<text x="50" y="360" font-family="sans-serif" font-size="19">Candidate errors: 4–8; selected errors/opens: 4/15 (unchanged)</text>
<text x="30" y="450" font-family="sans-serif" font-size="19">Endpoint groups move together. Pads, vias and interior contacts remain fixed.</text>
<text x="30" y="492" font-family="sans-serif" font-size="21">Diagnostic only. No production repair or routing improvement claimed.</text>
