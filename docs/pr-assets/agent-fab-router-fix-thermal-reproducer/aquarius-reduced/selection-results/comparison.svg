<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><rect width="1100" height="520" fill="white"/><g font-family="sans-serif" fill="#182838"><text x="35" y="45" font-size="25">Full-board bounded dogleg selection</text><text x="35" y="78" font-size="16">Native errors per candidate; three identical repeats; 15 opens throughout</text><text x="35" y="140" font-size="18">baseline</text><rect x="285" y="115" width="390" height="36" fill="#697686"/><text x="690" y="140" font-size="18">6 errors; rejected</text><text x="35" y="205" font-size="18">track-2-offset--1</text><rect x="285" y="180" width="390" height="36" fill="#697686"/><text x="690" y="205" font-size="18">6 errors; rejected</text><text x="35" y="270" font-size="18">track-2-offset-1</text><rect x="285" y="245" width="325" height="36" fill="#17815d"/><text x="625" y="270" font-size="18">5 errors; selected</text><text x="35" y="335" font-size="18">track-3-offset--1</text><rect x="285" y="310" width="455" height="36" fill="#697686"/><text x="755" y="335" font-size="18">7 errors; rejected</text><text x="35" y="400" font-size="18">track-3-offset-1</text><rect x="285" y="375" width="390" height="36" fill="#697686"/><text x="690" y="400" font-size="18">6 errors; rejected</text><text x="35" y="475" font-size="17">All candidates preserve terminal pairs. Selection also rejects new error records.</text><text x="35" y="502" font-size="15">Fixture-specific static experiment; frozen-suite thermal failures remain unresolved.</text></g></svg>