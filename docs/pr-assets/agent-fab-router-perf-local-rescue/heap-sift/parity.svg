<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440"><rect width="1100" height="440" fill="white"/><g font-family="sans-serif" fill="#182639"><text x="35" y="42" font-size="25">Heap pop-order prerequisite: finite parity, exceptional rejection</text><text x="35" y="77" font-size="17">Standalone diagnostic only; no routing speed or DRC claim</text><text x="35" y="133" font-size="18">Equal priorities</text><rect x="245" y="110" width="382.6857142857143" height="32" fill="#34776c"/><text x="642.6857142857143" y="133" font-size="18">13,394 pops</text><text x="35" y="188" font-size="18">Mixed operations</text><rect x="245" y="165" width="379.3142857142857" height="32" fill="#34776c"/><text x="639.3142857142857" y="188" font-size="18">13,276 pops</text><text x="35" y="243" font-size="18">Capacity growth</text><rect x="245" y="220" width="571.4285714285714" height="32" fill="#34776c"/><text x="831.4285714285714" y="243" font-size="18">20,000 pops</text><text x="35" y="298" font-size="18">Clear/reset reuse</text><rect x="245" y="275" width="190.65714285714284" height="32" fill="#34776c"/><text x="450.65714285714284" y="298" font-size="18">6,673 pops</text><text x="35" y="370" font-size="19" fill="#a33434">Exceptional priorities: mismatch after 16 matching pops; candidate parked.</text><text x="35" y="408" font-size="16">53,343 finite pops checked against original heap and independent linear-scan queue.</text></g></svg>