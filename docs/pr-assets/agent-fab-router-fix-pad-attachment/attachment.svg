<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440"><rect width="1400" height="440" fill="#101925"/><g transform="translate(35 70)"><text x="0" y="-25" fill="white" font-family="sans-serif" font-size="22">Before: pad centre blocked, net open</text><rect x="10" y="140" width="200" height="20" fill="#f7c562"/><rect x="410" y="140" width="200" height="20" fill="#f7c562"/><rect x="100" y="90" width="20" height="20" fill="#e46d76"/><rect x="100" y="190" width="20" height="20" fill="#e46d76"/><circle cx="110" cy="150" r="40" fill="none" stroke="#f29191" stroke-dasharray="5 4" stroke-width="2"/><text x="0" y="290" fill="#cad5e2" font-family="sans-serif" font-size="17">Dashed circle: 0.8 mm track end at centre hits neighbours</text></g><g transform="translate(735 70)"><text x="0" y="-25" fill="white" font-family="sans-serif" font-size="22">After: full-width pad edge attachment</text><rect x="10" y="140" width="200" height="20" fill="#f7c562"/><rect x="410" y="140" width="200" height="20" fill="#f7c562"/><rect x="100" y="90" width="20" height="20" fill="#e46d76"/><rect x="100" y="190" width="20" height="20" fill="#e46d76"/><polyline points="210,150 510,150" stroke="#7ce1b1" stroke-width="80" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.75"/><circle cx="110" cy="150" r="40" fill="none" stroke="#f29191" stroke-dasharray="5 4" stroke-width="2"/><text x="0" y="290" fill="#cad5e2" font-family="sans-serif" font-size="17">Open nets: 0; track width: 0.8 mm; no necking</text></g><text x="35" y="420" fill="#cad5e2" font-family="sans-serif" font-size="16">Synthetic geometry at scale; gold: power pads; red: other copper; green: emitted track</text></svg>